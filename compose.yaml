services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sigait
      POSTGRES_USER: sigait
      POSTGRES_PASSWORD: sigait
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigait -d sigait"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://sigait:sigait@db:5432/sigait
      FRONTEND_URL: http://localhost:5173
    command: uvicorn sigait_api.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    command: pnpm --filter web dev --host 0.0.0.0
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/workspace/apps/web
      - ./packages/api-client:/workspace/packages/api-client
      - web_node_modules:/workspace/apps/web/node_modules
      - api_client_node_modules:/workspace/packages/api-client/node_modules

volumes:
  postgres_data:
  web_node_modules:
  api_client_node_modules:
